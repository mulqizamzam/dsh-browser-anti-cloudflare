name: CI
on:
  push:
    branches: [main, master, hardening/secure-session-production-gates]
  pull_request:
    branches: [main, master, hardening/secure-session-production-gates]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Build, typecheck, security regression
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - name: Publish generated pnpm lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: npx playwright install --with-deps chromium
      - run: pnpm run test
      - name: Verify no unsafe eval enabled by default
        run: '! grep -R "allowUnsafeEval: true" src'
      - name: Verify session encryption is enforced
        run: grep -q "session.encryptionKey" src/index.ts
      - name: Verify deployment egress policy exists
        run: test -f deploy/egress/entrypoint.sh
      - name: Commit generated lockfile for repository-owner PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "pnpm-lock.yaml is already current"
            exit 0
          fi
          git commit -m "chore(deps): sync pnpm lockfile"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${HEAD_REF}"
  browser-integration:
    name: Browser integration
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm run test:integration
        timeout-minutes: 10
