name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Grab 20 lines after ## Changelog or ## v{version}
          CHANGELOG=$(awk "/^## \[${VERSION}\]/,/^## /" CHANGELOG.md 2>/dev/null | head -30 || true)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Release $VERSION — anti-detection browser-use provider for DSH."
          fi
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: ${{ steps.changelog.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          files: |
            lib/index.js
            lib/types/**/*.d.ts

  release-audit:
    name: Generate release audit
    runs-on: ubuntu-latest
    needs: [publish, github-release]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate audit report
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          git fetch --force --tags origin
          TAG="${GITHUB_REF#refs/tags/}"
          python3 scripts/generate_release_audit.py --tag "$TAG"

      - name: Attach audit assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for EXT in md json; do
            ASSET="release-audits/$TAG.$EXT"
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$TAG.$EXT"; then
              echo "Preserving existing release audit asset: $TAG.$EXT"
            else
              gh release upload "$TAG" "$ASSET"
            fi
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-audit-${{ github.ref_name }}
          path: |
            release-audits/${{ github.ref_name }}.md
            release-audits/${{ github.ref_name }}.json
          if-no-files-found: error
          retention-days: 90
